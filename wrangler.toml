# ============================================================
# NextList Web — Cloudflare Pages 配置
# ------------------------------------------------------------
# Pages 部署通常在 Dashboard 中配置（构建命令 pnpm build，输出目录 dist），
# 本文件用于 wrangler CLI 本地开发（wrangler pages dev）与 KV 绑定声明。
#
# 创建 KV namespace：
#   npx wrangler kv namespace create PLUGINS_KV
# 将下方 id 替换为命令输出的真实 namespace id。
# ============================================================

name = "nextlist-web"
compatibility_date = "2025-06-01"
pages_build_output_dir = "dist"

# ---- 环境变量（公开，非敏感） ----
[vars]
PLUGIN_TOPIC = "nextlist-plugin"
REFRESH_COOLDOWN_SECONDS = "300"

# ---- KV 绑定：插件市场数据 ----
# ⚠️ 部署前请把 id 替换为你的真实 namespace id（占位符会导致远程部署读取失败）
[[kv_namespaces]]
binding = "PLUGINS_KV"
id = "f9f56be7f1b14131ae89eb9e4188e4f8"

# ---- 敏感变量请使用 Secrets，不要写进本文件 ----
# 在 Dashboard → Settings → Environment variables 添加，或使用：
#   npx wrangler pages secret put GITHUB_CLIENT_ID
#   npx wrangler pages secret put GITHUB_CLIENT_SECRET
#
# 本地开发请创建 .dev.vars 文件（参考 .dev.vars.example）。
